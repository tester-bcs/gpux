# niceguy: public entrypoint for gpux Studio (Plan B — direct from niceguy)
# /etc/nginx/sites-available/gpux-studio  (symlink into sites-enabled)
# TLS + basic-auth in front of the gpux-router on 100.64.0.2:8096

server {
    listen 51.89.98.172:80;
    server_name studio.51-89-98-172.sslip.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 51.89.98.172:443 ssl;
    server_name studio.51-89-98-172.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/studio.51-89-98-172.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.51-89-98-172.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "gpux Studio";
    auth_basic_user_file /etc/nginx/.htpasswd_gpux_studio;

    location / {
        proxy_pass http://100.64.0.2:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE (/api/events): no buffering, long timeouts
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # img2img uploads travel as base64 in the JSON body
        client_max_body_size 64m;
    }
}
