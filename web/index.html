<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WanGP Studio</title>
<style>
:root {
  --bg: #0a0a0a; --card: #171717; --card2: #1f1f1f;
  --text: #ececec; --dim: #8a8a8a; --accent: #ff7a1a;
  --accent-dim: #ff7a1a33; --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh; padding: 0 20px 60px;
}
.hero { max-width: 860px; margin: 0 auto; padding-top: 48px; }
.logo { text-align: center; margin-bottom: 28px; }
.logo h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.logo h1 span { color: var(--accent); }
.logo p { color: var(--dim); font-size: 13px; margin-top: 4px; }

/* prompt card */
.prompt-card {
  background: var(--card); border: 1px solid #262626; border-radius: var(--radius);
  padding: 14px; transition: border-color .2s;
}
.prompt-card:focus-within { border-color: #3a3a3a; }
textarea {
  width: 100%; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 17px; line-height: 1.5; resize: none;
  font-family: inherit; min-height: 56px; max-height: 200px;
}
textarea::placeholder { color: #555; }
.modeswitch { display: flex; gap: 6px; margin-bottom: 12px; }
.ms-btn {
  background: var(--card2); border: 1px solid #2a2a2a; border-radius: 10px;
  color: var(--dim); font-size: 13px; padding: 7px 14px; cursor: pointer;
}
.ms-btn.active { color: var(--text); border-color: var(--accent-dim); background: var(--accent-dim); }
.tile.audio {
  aspect-ratio: 4/3; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; padding: 16px; background: var(--card2);
}
.tile.audio .aicon { font-size: 30px; opacity: .8; }
.tile.audio audio { width: 100%; }
.tile.audio .alabel { font-size: 11px; color: var(--dim); text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.controls {
  display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap;
}
.chip {
  background: var(--card2); border: 1px solid #2a2a2a; border-radius: 10px;
  color: var(--dim); font-size: 13px; padding: 8px 12px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; user-select: none;
}
.chip:hover { border-color: #3a3a3a; color: var(--text); }
.chip.active { color: var(--text); border-color: var(--accent-dim); }
.chip .val { color: var(--accent); }
.popover {
  display: none; background: var(--card2); border: 1px solid #2a2a2a;
  border-radius: 12px; padding: 14px; margin-top: 10px;
  display: grid; gap: 14px;
}
.popover.hidden { display: none; }
.pop-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.pop-row label { font-size: 13px; color: var(--dim); }
.pop-row .rv { color: var(--text); font-size: 13px; min-width: 86px; text-align: right; }
input[type=range] { flex: 1; accent-color: var(--accent); }
input[type=text].seedin {
  background: var(--card); border: 1px solid #2a2a2a; border-radius: 8px;
  color: var(--text); padding: 7px 10px; font-size: 13px; width: 130px; outline: none;
}
.res-presets { display: flex; gap: 6px; flex-wrap: wrap; }
.res-p {
  border: 1px solid #2a2a2a; border-radius: 8px; background: transparent;
  color: var(--dim); font-size: 12px; padding: 6px 10px; cursor: pointer;
}
.res-p.active { color: var(--accent); border-color: var(--accent-dim); }

.gen-btn {
  margin-left: auto; background: var(--accent); color: #000; border: none;
  border-radius: 10px; padding: 10px 26px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: filter .15s, opacity .2s;
}
.gen-btn:hover { filter: brightness(1.1); }
.gen-btn:disabled { opacity: .4; cursor: not-allowed; }

/* current job */
.job-card {
  max-width: 860px; margin: 18px auto 0; background: var(--card);
  border: 1px solid #262626; border-radius: var(--radius); padding: 14px;
  display: none;
}
.job-card.show { display: block; }
.job-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); }
.job-top b { color: var(--text); font-weight: 500; }
.pbar { height: 5px; background: #262626; border-radius: 3px; margin-top: 10px; overflow: hidden; }
.pbar div { height: 100%; background: var(--accent); width: 0%; transition: width .4s; border-radius: 3px; }
.job-preview { margin-top: 12px; text-align: center; display: none; }
.job-preview img { max-width: 100%; max-height: 340px; border-radius: 10px; }
.job-err { margin-top: 10px; color: #ff5c5c; font-size: 13px; display: none; }

/* gallery */
.gallery-wrap { max-width: 1100px; margin: 40px auto 0; }
.gal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
.gal-head h2 { font-size: 15px; font-weight: 500; color: var(--dim); }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
.tile {
  position: relative; border-radius: 12px; overflow: hidden; cursor: pointer;
  background: var(--card); animation: pop .25s ease;
  aspect-ratio: 4/3;
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
.tile:hover img { transform: scale(1.04); }
@keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
.info-btn {
  position: absolute; top: 7px; right: 7px; width: 24px; height: 24px; z-index: 3;
  border-radius: 50%; background: #000000b3; border: 1px solid #ffffff40;
  color: #fff; font: italic 600 14px/1 Georgia, 'Times New Roman', serif;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  opacity: 0; transition: opacity .15s, background .15s;
}
.tile:hover .info-btn, .info-btn.pinned { opacity: 1; }
.info-btn:hover { background: var(--accent); color: #000; }
.prompt-pop {
  position: fixed; z-index: 70; max-width: 380px; display: none;
  background: var(--card2); border: 1px solid #3a3a3a; border-radius: 10px;
  padding: 11px 13px; font-size: 13px; line-height: 1.45; color: var(--text);
  white-space: pre-wrap; word-break: break-word; box-shadow: 0 10px 34px #000000a8;
}
.prompt-pop.show { display: block; }
.prompt-pop .pp-label {
  color: var(--dim); font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
  margin-bottom: 6px;
}
.prompt-pop .pp-label.foot { margin: 8px 0 0; }
.empty { color: #555; font-size: 14px; text-align: center; padding: 50px 0; }
.empty em { color: var(--dim); cursor: pointer; font-style: normal; border-bottom: 1px dashed #444; }
.empty em:hover { color: var(--accent); border-color: var(--accent); }

/* lightbox */
.lb {
  display: none; position: fixed; inset: 0; background: #000000e6; z-index: 50;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
}
.lb.show { display: flex; }
.lb img { max-width: 92vw; max-height: 78vh; border-radius: 10px; }
.lb-meta { color: var(--dim); font-size: 13px; max-width: 760px; text-align: center; word-break: break-word; }
.lb-actions { display: flex; gap: 10px; }
.lb-btn {
  background: var(--card2); color: var(--text); border: 1px solid #2a2a2a;
  border-radius: 10px; padding: 9px 18px; font-size: 14px; cursor: pointer; text-decoration: none;
}
.lb-btn:hover { border-color: var(--accent-dim); }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--card2); border: 1px solid #2a2a2a; color: var(--text);
  border-radius: 10px; padding: 10px 18px; font-size: 14px; display: none; z-index: 60;
}
</style>
</head>
<body>

<div class="hero">
  <div class="logo">
    <h1>WanGP <span>Studio</span></h1>
    <p>локальная генерация изображений · Flux Klein 4B</p>
  </div>

  <div class="prompt-card">
    <div class="modeswitch">
      <button class="ms-btn active" id="modeImage" data-m="image">🖼 Изображение</button>
      <button class="ms-btn" id="modeAudio" data-m="audio">🎵 Аудио</button>
    </div>
    <textarea id="prompt" placeholder="Опиши, что нарисовать… (Enter — сгенерировать)" rows="2"></textarea>
    <div class="controls" id="ctrlsImage">
      <div class="chip" id="resChip">▦ <span class="val" id="resVal">512×512</span></div>
      <div class="chip" id="stepsChip">◍ <span class="val" id="stepsVal">6</span> шагов</div>
      <div class="chip" id="seedChip">⚄ <span class="val" id="seedVal">random</span></div>
      <div class="chip" id="draftChip" title="черновик через публичную сеть AI Horde — промпт уйдёт наружу">☁ draft</div>
      <div class="chip" id="img2imgChip" title="генерация на основе загруженного изображения (img2img)">🖼 <span class="val" id="img2imgVal">img2img</span><span id="img2imgClear" style="display:none; margin-left:4px; cursor:pointer;">✕</span></div>
      <input type="file" id="img2imgFile" accept="image/*" style="display:none">
      <button class="gen-btn" id="genBtn" disabled>Generate</button>
    </div>
    <div class="controls" id="ctrlsAudio" hidden>
      <select id="audioModel" class="seedin" style="width:auto"></select>
      <label id="audioDurWrap" style="display:flex;align-items:center;gap:8px;color:var(--dim);font-size:13px">
        <span id="audioDurLbl">длительность 8с</span>
        <input type="range" id="audioDur" min="2" max="120" value="8" step="1" style="width:150px">
      </label>
      <button class="gen-btn" id="genBtnA" disabled>Generate</button>
    </div>
    <div id="i2iPreview" style="display:none; margin-top:10px;">
      <img id="i2iPreviewImg" alt="источник" style="max-height:96px; border-radius:8px; border:1px solid #2a2a2a; display:block;">
    </div>

    <div class="popover hidden" id="resPop">
      <div class="pop-row"><label>Разрешение</label></div>
      <div class="res-presets" id="resPresets">
        <button class="res-p active" data-r="512x512">512×512</button>
        <button class="res-p" data-r="768x512">768×512</button>
        <button class="res-p" data-r="1024x1024">1024×1024</button>
        <button class="res-p" data-r="1280x960">1280×960</button>
        <button class="res-p" data-r="1536x1152">1536×1152</button>
      </div>
    </div>
    <div class="popover hidden" id="stepsPop">
      <div class="pop-row">
        <label>Шаги инференса</label><span class="rv" id="stepsRV">6 — баланс</span>
      </div>
      <div class="pop-row"><input type="range" id="stepsRange" min="4" max="12" value="6" step="1"></div>
    </div>
    <div class="popover hidden" id="seedPop">
      <div class="pop-row">
        <label>Seed (пусто = случайный)</label>
        <input type="text" class="seedin" id="seedIn" placeholder="напр. 42">
      </div>
    </div>
  </div>

  <div class="job-card" id="jobCard">
    <div class="job-top"><span><b id="jobPhase">инициализация</b></span><span id="jobStep"></span></div>
    <div class="pbar"><div id="jobBar"></div></div>
    <div class="job-preview" id="jobPrev"><img id="jobPrevImg" alt=""></div>
    <div class="job-err" id="jobErr"></div>
  </div>
</div>

<div class="gallery-wrap">
  <div class="gal-head"><h2>Галерея</h2>
    <div style="display:flex; gap:8px; align-items:center;">
      <a class="chip" href="join.html" style="text-decoration:none">+ Подключить машину</a>
      <span class="chip" id="galCount" style="cursor:default"></span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">Пока пусто. Попробуй: <em onclick="useExample()">рыжий кот на фоне солнечного леса</em></div>
</div>

<div class="lb" id="lb" onclick="if(event.target===this)closeLb()">
  <img id="lbImg">
  <audio id="lbAudio" controls hidden style="width:min(90vw,520px)"></audio>
  <div class="lb-meta" id="lbMeta"></div>
  <div class="lb-actions">
    <button class="lb-btn" id="lbToI2i">🖼 В img2img</button>
    <a class="lb-btn" id="lbDl" download>Скачать</a>
    <button class="lb-btn" onclick="closeLb()">Закрыть</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="prompt-pop" id="promptPop"></div>

<script>
const $ = id => document.getElementById(id);
const API = location.pathname.replace(/\/+$/, ''); // '' локально, '/studio' через прокси
let modelReady = false, busy = false, curJob = null;

/* ---- settings chips / popovers ---- */
function togglePop(id) {
  ['resPop','stepsPop','seedPop'].forEach(p => {
    const el = $(p);
    if (p === id) el.classList.toggle('hidden');
    else el.classList.add('hidden');
  });
}
$('resChip').onclick = () => togglePop('resPop');
$('stepsChip').onclick = () => togglePop('stepsPop');
$('seedChip').onclick = () => togglePop('seedPop');

let res = '512x512', steps = 6, seed = null, draft = false, initImage = null;
$('draftChip').onclick = () => {
  if (initImage) return;                 // draft/Horde overflow can't do img2img
  draft = !draft;
  $('draftChip').classList.toggle('active', draft);
};

/* ---- img2img source image ---- */
const I2I_MAX_BYTES = 18 * 1048576;
function setInitImage(dataUrl) {
  initImage = dataUrl;
  $('img2imgChip').classList.add('active');
  $('img2imgClear').style.display = 'inline';
  $('img2imgVal').textContent = 'img2img ✓';
  $('i2iPreviewImg').src = dataUrl;
  $('i2iPreview').style.display = 'block';
  if (draft) { draft = false; $('draftChip').classList.remove('active'); }
  $('draftChip').style.opacity = .35;
  $('draftChip').style.pointerEvents = 'none';
}
function clearInitImage() {
  initImage = null;
  $('img2imgChip').classList.remove('active');
  $('img2imgClear').style.display = 'none';
  $('img2imgVal').textContent = 'img2img';
  $('i2iPreview').style.display = 'none';
  $('draftChip').style.opacity = '';
  $('draftChip').style.pointerEvents = '';
}
$('img2imgChip').onclick = e => {
  if (e.target.id === 'img2imgClear') { clearInitImage(); return; }
  $('img2imgFile').click();
};
$('img2imgFile').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > I2I_MAX_BYTES) { toast('файл слишком большой (>18 МБ)'); return; }
  const rd = new FileReader();
  rd.onload = () => setInitImage(rd.result);
  rd.readAsDataURL(f);
};
$('resPresets').onclick = e => {
  if (!e.target.dataset.r) return;
  res = e.target.dataset.r;
  $('resVal').textContent = res.replace('x','×');
  document.querySelectorAll('.res-p').forEach(b => b.classList.toggle('active', b.dataset.r === res));
  togglePop('resPop');
};
$('stepsRange').oninput = e => {
  steps = +e.target.value;
  $('stepsVal').textContent = steps;
  $('stepsRV').textContent = steps <= 5 ? steps + ' — быстро' : steps <= 8 ? steps + ' — баланс' : steps + ' — макс. качество';
};
$('seedIn').oninput = e => {
  seed = e.target.value.trim() === '' ? null : parseInt(e.target.value) || null;
  $('seedVal').textContent = seed === null ? 'random' : seed;
};

/* ---- prompt: autosize + enter ---- */
const promptEl = $('prompt');
promptEl.addEventListener('input', () => {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 200) + 'px';
});
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
});
$('genBtn').addEventListener('click', generate);
$('genBtnA').addEventListener('click', generate);

/* ---- image / audio mode ---- */
let genMode = 'image';
let audioModels = {};   // alias -> model_cost entry (modality:audio)
const AUDIO_PH = {
  music: 'Опиши музыку: жанр, темп, инструменты, настроение…',
  sfx: 'Опиши звук: удар, свист, дождь, эмбиент…',
  tts: 'Текст для озвучки…',
};
function setMode(m) {
  genMode = m;
  $('modeImage').classList.toggle('active', m === 'image');
  $('modeAudio').classList.toggle('active', m === 'audio');
  $('ctrlsImage').hidden = m === 'audio';
  $('ctrlsAudio').hidden = m === 'image';
  if (m === 'audio') onAudioModelChange();
  else promptEl.placeholder = 'Опиши, что нарисовать… (Enter — сгенерировать)';
  updateBtn();
}
$('modeImage').onclick = () => setMode('image');
$('modeAudio').onclick = () => setMode('audio');
$('audioModel').onchange = onAudioModelChange;
$('audioDur').oninput = () => $('audioDurLbl').textContent = 'длительность ' + $('audioDur').value + 'с';
function onAudioModelChange() {
  const mc = audioModels[$('audioModel').value] || {};
  const isTts = mc.kind === 'tts';
  $('audioDurWrap').style.display = isTts ? 'none' : 'flex';
  if (mc.max_duration_s) $('audioDur').max = mc.max_duration_s;
  promptEl.placeholder = AUDIO_PH[mc.kind] || 'Опиши звук…';
}
async function loadAudioCaps() {
  try {
    const r = await fetch(API + '/api/status');
    const s = await r.json();
    const nodes = Array.isArray(s.nodes) ? s.nodes : [];
    const mc = {};
    nodes.forEach(n => Object.assign(mc, (n.caps || {}).model_cost || {}));
    audioModels = {};
    const sel = $('audioModel');
    sel.innerHTML = '';
    const LBL = { music: '🎵 Музыка', sfx: '💥 Звук/SFX', tts: '🗣 Речь' };
    for (const [alias, c] of Object.entries(mc)) {
      if (c.modality !== 'audio') continue;
      audioModels[alias] = c;
      const o = document.createElement('option');
      o.value = alias;
      o.textContent = (LBL[c.kind] || alias) + ' · ' + alias;
      sel.appendChild(o);
    }
    $('modeAudio').style.display = Object.keys(audioModels).length ? '' : 'none';
    onAudioModelChange();
  } catch (e) {}
}
loadAudioCaps();

function useExample() {
  promptEl.value = 'рыжий кот на фоне солнечного леса, детализированная шерсть, кинематографичный свет';
  promptEl.dispatchEvent(new Event('input'));
  promptEl.focus();
}

/* ---- generate ---- */
async function generate() {
  const p = promptEl.value.trim();
  if (busy || curJob || !modelReady || !p) return;
  let body;
  if (genMode === 'audio') {
    const mc = audioModels[$('audioModel').value] || {};
    body = { modality: 'audio', model: $('audioModel').value, prompt: p };
    if (mc.kind !== 'tts') body.duration_s = +$('audioDur').value;
    if (seed !== null) body.seed = seed;
  } else {
    body = { prompt: p, resolution: res, steps: steps, draft: draft,
             mode: initImage ? 'img2img' : 'txt2img' };
    if (initImage) body.init_image = initImage;
    if (seed !== null) body.seed = seed;
  }
  const btn = genMode === 'audio' ? $('genBtnA') : $('genBtn');
  btn.disabled = true;
  btn.textContent = 'Отправка…';
  try {
    const r = await fetch(API + '/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) {
      let msg = 'ошибка ' + r.status;
      try { msg = (await r.json()).detail || msg; } catch (e) {}
      toast(msg); updateBtn(); return;
    }
    const j = await r.json();
    curJob = j.id;
    if (j.swap) showJobCard('загрузка модели', j.eta_s ? '~' + j.eta_s + 'с' : '', 0);
    else showJobCard('в очереди…', '', 0);
    if (j.warnings && j.warnings.length) toast(j.warnings.join('; '));
    updateBtn();
  } catch (e) {
    toast('нет связи с сервером'); updateBtn();
  }
}

function showJobCard(phase, step, pct, previewUrl) {
  $('jobCard').classList.add('show');
  $('jobPhase').textContent = {'encoding_text':'кодирование промпта','inference':'генерация','decoding':'декодирование','в очереди…':'в очереди…','загрузка модели':'загрузка модели в GPU…','model_swap':'загрузка модели в GPU…'}[phase] || phase;
  $('jobStep').textContent = step;
  $('jobBar').style.width = pct + '%';
  if (previewUrl) {
    $('jobPrev').style.display = 'block';
    $('jobPrevImg').src = previewUrl + '?t=' + Date.now();
  }
}

/* ---- SSE events ---- */
const es = new EventSource(API + '/api/events');
es.onmessage = e => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'hello') { modelReady = ev.ready; busy = ev.busy; updateBtn(); }
  else if (ev.type === 'ready') { modelReady = true; updateBtn(); toast('модель готова'); }
  else if (ev.type === 'job_start' && ev.id === curJob) showJobCard('в очереди…', '', 0);
  else if (ev.type === 'model_swap' && ev.id === curJob) showJobCard('model_swap', ev.eta_s ? '~' + ev.eta_s + 'с' : '', 0);
  else if (ev.type === 'progress' && ev.id === curJob) showJobCard(ev.phase, 'шаг ' + ev.step, ev.pct);
  else if (ev.type === 'preview' && ev.id === curJob) showJobCard($('jobPhase').textContent, $('jobStep').textContent, parseInt($('jobBar').style.width)||0, API + ev.url);
  else if (ev.type === 'job_done' && ev.id === curJob) {
    hideJobCard(); busy = false; updateBtn(); curJob = null;
    toast('готово за ' + ev.total + 's'); loadGallery();
  }
  else if (ev.type === 'job_error' && ev.id === curJob) {
    busy = false; updateBtn(); curJob = null;
    $('jobErr').style.display = 'block'; $('jobErr').textContent = ev.error;
    setTimeout(hideJobCard, 6000);
  }
};

function hideJobCard() {
  $('jobCard').classList.remove('show');
  $('jobPrev').style.display = 'none';
  $('jobErr').style.display = 'none';
}
function updateBtn() {
  const generating = busy || curJob !== null;
  const dis = generating || !modelReady || !promptEl.value.trim();
  const txt = generating ? 'Генерация…' : !modelReady ? 'Загрузка модели…' : 'Generate';
  for (const id of ['genBtn', 'genBtnA']) { $(id).disabled = dis; $(id).textContent = txt; }
}
promptEl.addEventListener('input', updateBtn);

/* ---- gallery ---- */
const escHtml = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// fallback: recover a (truncated) prompt from WanGP's filename convention
function promptFromName(name) {
  const m = name.replace(/\.[a-z0-9]+$/i, '')
                .match(/^\d{4}-\d\d-\d\d-\d\dh\d\dm\d\ds_seed\d+_(.+)$/);
  return m ? m[1] : null;
}
function tilePrompt(f) {
  if (f.prompt) return { text: f.prompt, exact: true };
  const n = promptFromName(f.name);
  return n ? { text: n, exact: false } : null;
}
function showPromptPop(ev, f, btn) {
  const pp = $('promptPop'), p = tilePrompt(f);
  if (!p) return;
  const label = (f.mode === 'img2img' ? 'img2img · промпт' : 'промпт') + (p.exact ? '' : ' (из имени файла)');
  let html = `<div class="pp-label">${escHtml(label)}</div>${escHtml(p.text)}${p.exact ? '' : ' …'}`;
  const foot = [];
  if (f.seed != null) foot.push('seed ' + f.seed);
  if (f.steps != null) foot.push(f.steps + ' шагов');
  if (f.node) foot.push(f.node);
  if (foot.length) html += `<div class="pp-label foot">${escHtml(foot.join(' · '))}</div>`;
  pp.innerHTML = html;
  pp.classList.add('show');
  document.querySelectorAll('.info-btn.pinned').forEach(b => b.classList.remove('pinned'));
  if (btn) btn.classList.add('pinned');
  const r = btn.getBoundingClientRect(), pw = pp.offsetWidth, ph = pp.offsetHeight;
  let x = r.right + 8, y = r.top;
  if (x + pw > innerWidth - 8) x = r.left - pw - 8;
  if (x < 8) x = 8;
  if (y + ph > innerHeight - 8) y = innerHeight - ph - 8;
  pp.style.left = x + 'px';
  pp.style.top = Math.max(8, y) + 'px';
}
function hidePromptPop() {
  $('promptPop').classList.remove('show');
  document.querySelectorAll('.info-btn.pinned').forEach(b => b.classList.remove('pinned'));
}
document.addEventListener('click', e => {
  if (!e.target.closest('.info-btn') && !e.target.closest('.prompt-pop')) hidePromptPop();
});
document.addEventListener('scroll', hidePromptPop, true);

async function loadGallery() {
  const r = await fetch(API + '/api/gallery');
  const j = await r.json();
  $('galCount').textContent = j.files.length;
  $('empty').style.display = j.files.length ? 'none' : 'block';
  const grid = $('grid');
  grid.innerHTML = '';
  j.files.forEach(f => {
    const d = document.createElement('div');
    if (f.modality === 'audio') {
      d.className = 'tile audio';
      const dur = f.duration_s ? ` · ${f.duration_s}с` : '';
      d.innerHTML = `<div class="aicon">${f.kind === 'tts' ? '🗣' : '🎵'}</div>` +
        `<audio controls preload="none" src="${API}${f.url}" onclick="event.stopPropagation()"></audio>` +
        `<div class="alabel">${escHtml((tilePrompt(f) || {}).text || f.name)}${dur}</div>`;
      d.onclick = () => openLb(f);
      grid.appendChild(d);
      return;
    }
    d.className = 'tile';
    d.innerHTML = `<img loading="lazy" src="${API}${f.url}" alt="">`;
    d.onclick = () => openLb(f);
    if (tilePrompt(f)) {
      const ib = document.createElement('div');
      ib.className = 'info-btn';
      ib.textContent = 'i';
      ib.title = 'исходный промпт';
      ib.onclick = e => {
        e.stopPropagation();
        if (ib.classList.contains('pinned')) { hidePromptPop(); return; }
        showPromptPop(e, f, ib);
      };
      d.appendChild(ib);
    }
    grid.appendChild(d);
  });
}

function openLb(f) {
  const isAudio = f.modality === 'audio';
  $('lbImg').hidden = isAudio;
  $('lbAudio').hidden = !isAudio;
  if (isAudio) { $('lbAudio').src = API + f.url; }
  else { $('lbImg').src = API + f.url; }
  $('lbToI2i').style.display = isAudio ? 'none' : '';
  $('lbDl').href = API + f.url;
  $('lbDl').download = f.name;
  const mb = f.size ? (f.size / 1048576).toFixed(2) + ' МБ' : '';
  const p = tilePrompt(f);
  $('lbMeta').textContent = (p ? p.text + (p.exact ? '' : ' …') + '  ·  ' : '') + f.name + (mb ? '  ·  ' + mb : '');
  $('lbDl').onclick = () => {
    toast('закачка пошла' + (mb ? ' (' + mb + ')' : '') + ' — файл появится в загрузках');
  };
  $('lb').classList.add('show');
}
function closeLb() { $('lb').classList.remove('show'); try { $('lbAudio').pause(); } catch (e) {} }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

$('lbToI2i').onclick = async () => {
  try {
    const rr = await fetch($('lbImg').src);
    const blob = await rr.blob();
    if (blob.size > I2I_MAX_BYTES) { toast('картинка слишком большая для img2img'); return; }
    const rd = new FileReader();
    rd.onload = () => {
      setInitImage(rd.result);
      closeLb();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      promptEl.focus();
      toast('источник загружен — впиши, что изменить, и Generate');
    };
    rd.readAsDataURL(blob);
  } catch (e) { toast('не удалось загрузить картинку'); }
};

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 3000);
}

/* ---- status poll for init ---- */
async function pollStatus() {
  try {
    const r = await fetch(API + '/api/status');
    const s = await r.json();
    // router aggregate shape: {ready, nodes:[{ok,ready,busy,detail:{init_elapsed,init_error}}], ...}
    // direct-node shape:      {ready, busy, init_elapsed, init_error}
    const nodes = Array.isArray(s.nodes) ? s.nodes : null;
    const up = nodes ? nodes.filter(n => n.ok) : null;   // only reachable nodes
    const modelUp = up ? up.some(n => n.ready) : !!s.ready;
    const initErr = up ? up.some(n => n.detail && n.detail.init_error) : !!s.init_error;
    const initElapsed = up && up[0] && up[0].detail ? up[0].detail.init_elapsed : s.init_elapsed;
    // model is loaded somewhere but the router has no free slot => a job is running
    busy = nodes ? (modelUp && s.free === 0) : !!s.busy;
    // fallback если SSE отвалился: проверяем свою задачу напрямую пока она активна
    if (curJob) {
      const jr = await fetch(API + '/api/jobs/' + curJob);
      const jj = await jr.json();
      if (jj.status === 'done') {
        hideJobCard(); curJob = null; busy = false;
        toast('готово за ' + (jj.total || '?') + 's'); loadGallery();
      } else if (jj.status === 'error') {
        curJob = null; busy = false;
        $('jobErr').style.display = 'block'; $('jobErr').textContent = jj.error || 'ошибка';
        setTimeout(hideJobCard, 6000);
      }
    }
    modelReady = modelUp;
    updateBtn();
    if (!modelUp && !initErr)
      $('genBtn').textContent = initElapsed ? `Загрузка модели… ${Math.round(initElapsed)}s` : 'Загрузка модели…';
    if (initErr) $('genBtn').textContent = 'Ошибка init';
  } catch (e) {}
  setTimeout(pollStatus, 2000);
}

loadGallery();
pollStatus();
updateBtn();
</script>
</body>
</html>
